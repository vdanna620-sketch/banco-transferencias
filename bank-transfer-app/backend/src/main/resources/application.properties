spring.application.name=banktransfer
server.port=8080

# PostgreSQL datasource (override with environment variables if needed)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banktransferdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# CORS origin allowed for the React frontend
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000}

# Springdoc / Swagger UI -> http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.operations-sorter=method
